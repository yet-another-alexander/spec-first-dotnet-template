name: Mutation testing

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  stryker:
    name: Stryker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet stryker
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: StrykerOutput
